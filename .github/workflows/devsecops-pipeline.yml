name: Auto DevSecOps Pipeline

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Docker image to test and auto-fix'
        required: true
        default: 'nginx:latest'

env:
  REGISTRY: ghcr.io

jobs:
  full-security-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup environment
      id: setup
      run: |
        echo "IMAGE=${{ github.event.inputs.image_name }}" >> $GITHUB_OUTPUT
        echo "🎯 Processing image: ${{ github.event.inputs.image_name }}"
        mkdir -p security-reports pipeline-results

    - name: Install security tools
      run: |
        echo "🔧 Installing security tools..."
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        echo "Trivy version:" && trivy --version
        curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
        echo "Grype version:" && grype version

    - name: 📊 INITIAL SECURITY SCAN
      id: initial_scan
      run: |
        echo "🔍 STARTING INITIAL SECURITY SCAN"
        echo "📦 Image: ${{ steps.setup.outputs.IMAGE }}"
        docker pull ${{ steps.setup.outputs.IMAGE }}
        echo "🛡️ Running Trivy initial scan..."
        trivy image --format json --output security-reports/initial-trivy.json ${{ steps.setup.outputs.IMAGE }}
        echo "🛡️ Running Grype initial scan..."
        grype ${{ steps.setup.outputs.IMAGE }} -o json > security-reports/initial-grype.json
        sudo apt-get install -y jq
        INITIAL_CRITICAL=$(trivy image --severity CRITICAL --format json ${{ steps.setup.outputs.IMAGE }} | jq '.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")' | jq -s length)
        INITIAL_HIGH=$(trivy image --severity HIGH --format json ${{ steps.setup.outputs.IMAGE }} | jq '.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")' | jq -s length)
        echo "INITIAL_CRITICAL=${INITIAL_CRITICAL:-0}" >> $GITHUB_ENV
        echo "INITIAL_HIGH=${INITIAL_HIGH:-0}" >> $GITHUB_ENV
        echo "✅ Initial scan completed: $INITIAL_CRITICAL CRITICAL, $INITIAL_HIGH HIGH vulnerabilities"

    - name: 🔧 AUTO-REBUILD & HARDEN
      id: auto_rebuild
      run: |
        echo "🔧 STARTING AUTO-REBUILD PROCESS"
        IMAGE="${{ steps.setup.outputs.IMAGE }}"
        BASE_NAME=$(echo $IMAGE | cut -d':' -f1 | tr '/' '-' | tr ':' '-' | tr '.' '-')
        TIMESTAMP=$(date +%s)
        HARDENED_IMAGE="${BASE_NAME}-hardened-${TIMESTAMP}:latest"
        echo "🎯 Original: $IMAGE"
        echo "🛡️ Hardened: $HARDENED_IMAGE"
        CONTAINER_ID=$(docker create $IMAGE bash -c "tail -f /dev/null")
        if [ -n "$CONTAINER_ID" ]; then
          echo "✅ Container created: $CONTAINER_ID"
          docker start $CONTAINER_ID
          sleep 3
          echo "🔄 Updating system packages..."
          docker exec $CONTAINER_ID bash -c "apt-get update && apt-get upgrade -y" || echo "Package update completed"
          echo "🧹 Cleaning up..."
          docker exec $CONTAINER_ID bash -c "apt-get autoremove -y && apt-get clean"
          echo "📸 Committing hardened image..."
          docker commit $CONTAINER_ID $HARDENED_IMAGE
          docker stop $CONTAINER_ID
          docker rm $CONTAINER_ID
          echo "HARDENED_IMAGE=$HARDENED_IMAGE" >> $GITHUB_ENV
          echo "✅ Auto-rebuild completed: $HARDENED_IMAGE"
        else
          echo "❌ Failed to create container"
          exit 1
        fi

    - name: 📊 FINAL SECURITY SCAN
      id: final_scan
      run: |
        echo "🔍 STARTING FINAL SECURITY SCAN"
        echo "📦 Hardened image: $HARDENED_IMAGE"
        echo "🛡️ Running Trivy final scan..."
        trivy image --format json --output security-reports/final-trivy.json $HARDENED_IMAGE
        echo "🛡️ Running Grype final scan..."
        grype $HARDENED_IMAGE -o json > security-reports/final-grype.json
        FINAL_CRITICAL=$(trivy image --severity CRITICAL --format json $HARDENED_IMAGE | jq '.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")' | jq -s length)
        FINAL_HIGH=$(trivy image --severity HIGH --format json $HARDENED_IMAGE | jq '.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")' | jq -s length)
        echo "FINAL_CRITICAL=${FINAL_CRITICAL:-0}" >> $GITHUB_ENV
        echo "FINAL_HIGH=${FINAL_HIGH:-0}" >> $GITHUB_ENV
        CRITICAL_IMPROVEMENT=$(($INITIAL_CRITICAL - $FINAL_CRITICAL))
        HIGH_IMPROVEMENT=$(($INITIAL_HIGH - $FINAL_HIGH))
        echo "CRITICAL_IMPROVEMENT=$CRITICAL_IMPROVEMENT" >> $GITHUB_ENV
        echo "HIGH_IMPROVEMENT=$HIGH_IMPROVEMENT" >> $GITHUB_ENV
        echo "✅ Final scan completed: $FINAL_CRITICAL CRITICAL, $FINAL_HIGH HIGH vulnerabilities"
        echo "📈 Security improved: $CRITICAL_IMPROVEMENT CRITICAL, $HIGH_IMPROVEMENT HIGH vulnerabilities fixed"

    - name: 🚀 PUSH HARDENED IMAGE
      if: success()
      run: |
        echo "🚀 PUSHING HARDENED IMAGE TO REGISTRY"
        echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        # Use simple tag without repository name to avoid format issues
        REGISTRY_TAG="ghcr.io/${{ github.actor }}/hardened-image:latest"
        docker tag $HARDENED_IMAGE $REGISTRY_TAG
        docker push $REGISTRY_TAG
        echo "REGISTRY_TAG=$REGISTRY_TAG" >> $GITHUB_ENV
        echo "✅ Hardened image pushed: $REGISTRY_TAG"

    - name: 📈 GENERATE RESULTS
      run: |
        echo "📈 GENERATING PIPELINE RESULTS"
        cat > pipeline-results/summary.json << EOF
        {
          "pipeline_id": "${{ github.run_id }}",
          "timestamp": "$(date -Iseconds)",
          "original_image": "${{ steps.setup.outputs.IMAGE }}",
          "hardened_image": "$HARDENED_IMAGE",
          "registry_image": "$REGISTRY_TAG",
          "security_metrics": {
            "initial_scan": {
              "critical_vulnerabilities": $INITIAL_CRITICAL,
              "high_vulnerabilities": $INITIAL_HIGH
            },
            "final_scan": {
              "critical_vulnerabilities": $FINAL_CRITICAL,
              "high_vulnerabilities": $FINAL_HIGH
            },
            "improvements": {
              "critical_fixed": $CRITICAL_IMPROVEMENT,
              "high_fixed": $HIGH_IMPROVEMENT
            }
          },
          "workflow_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          "status": "completed"
        }
        EOF
        echo "✅ Results generated"

    - name: 📤 UPLOAD ARTIFACTS
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-results-${{ github.run_id }}
        path: |
          security-reports/
          pipeline-results/
        retention-days: 30

    - name: 🎯 PIPELINE SUMMARY
      run: |
        echo ""
        echo "🎉 AUTO DEVSECOPS PIPELINE COMPLETED SUCCESSFULLY!"
        echo "=================================================="
        echo "📊 SECURITY METRICS:"
        echo "   Initial: $INITIAL_CRITICAL CRITICAL, $INITIAL_HIGH HIGH vulnerabilities"
        echo "   Final:   $FINAL_CRITICAL CRITICAL, $FINAL_HIGH HIGH vulnerabilities"
        echo "   Improved: $CRITICAL_IMPROVEMENT CRITICAL, $HIGH_IMPROVEMENT HIGH vulnerabilities fixed"
        echo ""
        echo "🐳 IMAGES:"
        echo "   Original: ${{ steps.setup.outputs.IMAGE }}"
        echo "   Hardened: $HARDENED_IMAGE"
        echo "   Registry: $REGISTRY_TAG"
        echo ""
        echo "📁 ARTIFACTS: Security reports available for download"
        echo "🔗 WORKFLOW: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo ""
